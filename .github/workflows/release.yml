name: Release

on:
  push:
    tags:
      - "v*"

# Do not allow publishing from arbitrary PRs — only triggered by tag pushes.
# Publishing uses PyPI Trusted Publishing (GitHub Actions OIDC).
#
# NOTE: Configure a protected GitHub environment named `pypi` and register this
# workflow as a trusted publisher for the `noxgle/one` project on PyPI.
# The release tag must equal VERSION in one/config.py.

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/one-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install build twine

      # Tag == version check: the git tag (without 'v' prefix) must match
      # the VERSION defined in one/config.py.  This prevents publishing a
      # release whose artifacts do not match the tag.
      - name: Tag == version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("one/config.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "VERSION"
                  for target in node.targets
              ):
                  print(ast.literal_eval(node.value))
                  break
          else:
              raise SystemExit("VERSION was not found in one/config.py")
          PY
          )
          echo "Tag version:  $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION != package=$PKG_VERSION"
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          . .venv/bin/activate
          python -m build

      - name: Check package metadata
        run: |
          . .venv/bin/activate
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
