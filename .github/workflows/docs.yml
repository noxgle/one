name: Documentation checks
on:
  push:
    paths: ['website/**', 'scripts/generate_docs_reference.py', 'one/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'scripts/generate_docs_reference.py', 'one/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify generated inventories
        run: |
          export ONE_CODING_AGENT_DIR="$(mktemp -d)"
          python scripts/generate_docs_reference.py
          git diff --exit-code -- website/src/content/docs/reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build && npm run check:links
        working-directory: website
      - name: Check subdirectory hosting
        working-directory: website
        run: DOCS_BASE=/one/ npm run build && DOCS_BASE=/one/ npm run check:links
