[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "one"
version = "0.1.0"
description = "one coding agent (Python), based on pi coding-agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "picon" }]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "typer>=0.16.0",
  "rich>=13.7.1",
  "textual>=0.74.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
one = "one.cli.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["one*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
