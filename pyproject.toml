[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "one-agent"
dynamic = ["version"]
description = "one — autonomous terminal agent (CLI + TUI + JSON-RPC); optional human cooperation mode"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "picon" }]
keywords = [
    "agent",
    "ai",
    "coding",
    "llm",
    "automation",
    "terminal",
    "tui",
    "cli",
    "copilot",
    "autonomous",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Textual",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    # Windows is best-effort: core + TUI work, shell features use POSIX where available.
    # Full Windows shell coverage is tracked as experimental until CI validates it.
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "typer>=0.16.0",
    "rich>=13.7.1",
    "textual>=0.74.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
one = "one.cli.main:run"

[project.urls]
Homepage = "https://github.com/noxgle/one"
Repository = "https://github.com/noxgle/one"
Documentation = "https://github.com/noxgle/one#readme"
"Bug Tracker" = "https://github.com/noxgle/one/issues"
Changelog = "https://github.com/noxgle/one/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["one*"]

# Dynamic version read from one/config.py at build time.
[tool.setuptools.dynamic]
version = {attr = "one.config.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:one.*",
    "ignore:unclosed:ResourceWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741", "F841"]
